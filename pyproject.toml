[project]
name = "mcp-tools-py"
dynamic = ["version"]
authors = [
    {name = "Marcus Jellinghaus"},
]
description = "An MCP server for running python code checks (pylint, pytest and mypy)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "code-quality", "llm", "pylint", "pytest", "mypy", "claude", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pathspec>=0.12.1",
    # <2.0.0: mcp 2.x drops mcp.server.fastmcp (FastMCP -> MCPServer). See #216.
    "mcp[cli]>=1.3.0,<2.0.0",
    "pylint>=3.3.3",
    "pytest>=8.3.5",
    "pytest-json-report>=1.5.0",
    "pytest-asyncio>=0.25.3",
    "pytest-xdist>=3.5.0",
    "mypy>=1.13.0",
    "deptry>=0.25.1",
    "rope>=1.13.0",
    "jedi>=0.19.0",
    "igittigitt>=2.1.0",
    # >=2.12: first version allowing overlapping modules, which target-scripts-stdlib-only needs.
    "import-linter>=2.12",
    "vulture>=2.13",
    "ruff>=0.16.8",
    "bandit>=1.7.5",
    "black>=26.5.1",
    "isort>=9.0.1",
    "tach>=0.15.0",
    "mcp-coder-utils"
]

[project.optional-dependencies]
dev = [
    "mcp-workspace",
    # Architecture and code quality tools
    "pydeps>=1.12.0",
    # Builds the wheel that tests/test_packaging.py inspects
    "build>=1.0",
    # Runs the run_pytest_check(coverage=True) integration test
    "pytest-cov>=5.0",
    # patch = ["subprocess"] below needs 7.10; older versions only warn and don't trace
    "coverage>=7.10",
    # Pins the ruff the repo's own lint and format run on; the runtime
    # dependency above stays open for users.
    "ruff~=0.17.2",
    "diff-cover",
    ]
typecheck = ["mypy>=1.13.0"]

[project.scripts]
mcp-tools-py = "mcp_tools_py.main:main"

[project.entry-points."mcp_coder.toolkits"]
mcp-tools-py = "mcp_tools_py.toolkit:PythonToolkit"

[project.urls]
"Homepage" = "https://github.com/MarcusJellinghaus/mcp-tools-py"
"Bug Tracker" = "https://github.com/MarcusJellinghaus/mcp-tools-py/issues"
"Documentation" = "https://github.com/MarcusJellinghaus/mcp-tools-py#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-n auto --strict-markers"
markers = [
    "integration: Integration tests requiring external resources",
]
# rope's own Project.__init__ calls a method rope marks deprecated.
filterwarnings = [
    "ignore:Delete once deprecated functions are gone:DeprecationWarning:rope.*",
]

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.format]

[tool.ruff.lint]
# Rule selection — see the per-group comments below
# preview needed for DOC rules (pydoclint)
preview = true
explicit-preview-rules = true   # preview rules fire only when selected by exact code
select = [
    "D",
    "ANN",
    # DOC rules are preview-only; with explicit-preview-rules they must be
    # listed by exact code — a bare "DOC" prefix silently enforces nothing.
    "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
    "C4", "B",
    "SIM",
    # SIM905 is preview-only; see explicit-preview-rules note above.
    "SIM905",
    "E",
    "F",
    "S",
    # PLW1510 only: the PL prefix would re-enable pylint's disabled R category (PLR09xx).
    "PLW1510",
    # PLE2502 bidirectional-unicode: covers bandit B613 (trojansource), which has no S port.
    "PLE2502",
    "UP",
    "I",
]
ignore = [
    "D107",  # missing docstring in __init__ method (redundant with class docstring)
    "ANN401",  # Any is correct at library/CLI boundaries; mypy strict covers the rest
    "E501",  # line length is owned by the formatter (ruff format); not re-checked here
    "S404",  # importing subprocess is this tool's core function
    "S603",  # subprocess without shell=True is the SAFE form; argv is internally built
]

[tool.ruff.lint.per-file-ignores]
# tests: assert is the pytest idiom (S101); S105/S106/S108 fire on fake
# credentials and "/tmp/..." literals used as test data, never opened.
"tests/**/*.py" = ["D", "DOC", "SIM117", "S101", "S105", "S106", "S108"]
"src/mcp_tools_py/code_checker_ruff/*.py" = ["DOC502"]
# Target scripts run under the project's own interpreter, which may predate
# 3.10: a runtime X | Y union would raise there, so typing.Union stays.
"src/mcp_tools_py/utils/target_scripts/*.py" = ["UP007"]
# tools/: low-priority helper scripts that may move to an MCP server or be deleted;
# Returns sections are not required there.
"tools/**" = ["DOC201"]
# These call git by name on purpose (resolved via PATH).
"src/mcp_tools_py/refactoring/rope_tools.py" = ["S607"]
"tests/test_refactoring/test_integration.py" = ["S607"]
"tools/check_file_size.py" = ["S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Dependency-declaration hygiene. Run as `deptry src`.
# src only: running it over tests/ yields DEP004 noise and no signal.
[tool.deptry]
known_first_party = ["mcp_tools_py"]
# Extras holding dev-only packages: deptry exempts them from DEP002 and reports
# DEP004 if src/ imports them. Keep in sync with [project.optional-dependencies]:
# a renamed or removed extra only produces a deptry warning, not a failure.
optional_dependencies_dev_groups = ["dev", "typecheck"]

[tool.deptry.per_rule_ignores]
# DEP002: the checkers and formatters this server runs as subprocesses or
# pytest plugins. They are never imported, but the server needs them installed.
DEP002 = [
    "pylint", "pytest", "pytest-json-report", "pytest-asyncio", "pytest-xdist",
    "mypy", "deptry", "import-linter", "vulture", "ruff", "bandit", "black",
    "isort", "tach",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp.server.fastmcp"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jedi"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rope", "rope.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["igittigitt", "igittigitt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp_coder_utils", "mcp_coder_utils.*"]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C",       # conventions — not enabled in this project
    "R",       # refactor suggestions — not enabled in this project
    "W1203",   # logging-fstring-interpolation — project uses f-strings for readability
    "W0621",   # redefined-outer-name — standard pytest fixture pattern
    "W0511",   # fixme/TODO — informational only, not a quality gate
    "W0212",   # protected-access — legitimate in tests and controlled src usage
    "W0613",   # unused-argument — pytest fixtures injected by name
    "W0611",   # unused-import — owned by ruff F401 (pylint flags the X-as-X re-export convention)
    "W0404",   # reimported — reimports across test functions
    "W0718",   # broad-exception-caught — intentional catch-all in CLI/workflow error handling
    "W0706",   # try-except-raise — explicit re-raise for clarity in error chains
    "W4903",   # deprecated-argument — tracked for future cleanup
]
enable = ["R0401"]

[tool.mcp-tools-py]
# Formatter for run_format_code and mcp-coder workflows: ruff (import sorting + ruff format)
formatter = "ruff"

[tool.mcp-coder]
format_code = true

[tool.mcp-coder.install]
# Extras `mcp-coder install` passes to `uv` when provisioning this repo.
extras = "dev"
# Run by `mcp-coder install` after provisioning; any failure fails the install.
post_install_checks = [
    ["mcp-coder", "--version"],
    ["mcp-workspace", "--version"],
    ["mcp-tools-py", "--version"],
]

[tool.mcp-coder.install-from-github]
# All installed together WITH deps — uv resolves siblings in one pass
packages = [
    "mcp-workspace @ git+https://github.com/MarcusJellinghaus/mcp-workspace.git",
    "mcp-coder-utils @ git+https://github.com/MarcusJellinghaus/mcp-coder-utils.git",
    "mcp-coder @ git+https://github.com/MarcusJellinghaus/mcp_coder.git",
]
# Installed WITHOUT deps (depend on siblings — avoid downgrading)
packages-no-deps = []

[tool.mcp-coder.implement]
check_type_hints = true

[tool.mcp-coder.toolkit]
toolkit = "mcp-tools-py"

# Include tools directory in the distribution
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.uv.sources]
mcp-coder-utils = { git = "https://github.com/MarcusJellinghaus/mcp-coder-utils.git" }
mcp-workspace = { git = "https://github.com/MarcusJellinghaus/mcp-workspace.git" }

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
tag_regex = '^(?P<version>\d+\.\d+\.\d+)$'
# Version is automatically determined from git tags
# Tag format: 0.1.0 -> version 0.1.0
# Between releases: 0.1.0.devN+gHASH (includes commit count and hash)
